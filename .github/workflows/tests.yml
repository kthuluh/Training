name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node solo para poder ejecutar scripts/coros_fetch.mjs con COROS_FIXTURE
      # (un test del pipeline de Coros). No hace falta `npm install`: la ruta de
      # fixture no importa @pinta365/coros, así que seguimos sin red ni credenciales.
      # Si node no estuviera, ese test se salta solo en vez de fallar.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Los tests no usan red ni credenciales: van con fixtures locales.
      # `requests` sí hace falta: update_dashboard.py lo importa dentro de un
      # try/except, pero daily_brief.py y coros_mcp.py lo importan arriba del
      # todo y hay tests que importan esos módulos.
      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
