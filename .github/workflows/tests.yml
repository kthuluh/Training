name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Los tests no usan red ni credenciales: van con fixtures locales.
      # (update_dashboard.py importa `requests` dentro de un try/except, así que
      # no hace falta instalar dependencias.)
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
