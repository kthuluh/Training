name: Diagnose COROS MCP

# Solo consulta metadata pública. No usa, refresca ni registra credenciales.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar descubrimiento regional
        env:
          COROS_MCP_ISSUER: ${{ vars.COROS_MCP_ISSUER }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import coros_mcp
          configured = os.environ.get('COROS_MCP_ISSUER') or coros_mcp.DEFAULT_ISSUER
          try:
              issuer = coros_mcp.resolve_issuer(configured)
          except coros_mcp.CorosMCPError as exc:
              print(f'Descubrimiento fallido: {exc}')
              sys.exit(1)
          print(f'Issuer configurado: {configured}')
          print(f'Issuer seleccionado: {issuer}')
          print('Esta comprobación no valida el client_id ni el refresh token.')
          PY
