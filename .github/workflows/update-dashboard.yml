name: Update dashboard

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Necesario para pull/rebase
          ref: main        # Cambia si tu rama principal es otra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Update dashboard from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/update_dashboard.py

      - name: Commit and push (force bot changes if conflict)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/dashboard-kthuluh.html

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática del dashboard"

            BRANCH=$(git rev-parse --abbrev-ref HEAD)

            echo "📥 Haciendo pull con resolución automática a favor del bot..."
            git pull --rebase --strategy-option=theirs origin "$BRANCH" || {
              echo "⚠️ Conflictos detectados, aplicando resolución automática..."
              git rebase --abort
              git fetch origin "$BRANCH"
              git reset --hard HEAD
              git pull --strategy-option=theirs origin "$BRANCH"
              git add dashboard/dashboard-kthuluh.html
              git commit -m "Actualización automática del dashboard (conflictos resueltos)"
            }

            echo "📤 Subiendo cambios..."
            git push origin "$BRANCH"
          fi
