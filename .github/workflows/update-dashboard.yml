name: Update dashboard

on:
  schedule:
    # 05:05 UTC, justo después del correo (05:00) para no pisarse.
    - cron: "5 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Necesario para pull/rebase
          ref: main        # Cambia si tu rama principal es otra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # --- Coros (opcional): FC reposo, HRV, carga de entrenamiento --------
      # Igual que en el correo: sin secretos de Coros este paso no hace nada y
      # el dashboard se actualiza solo con Strava (las partes de Coros se
      # quedan con el último valor que tuvieran, manual o automático).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de JSR (@pinta365/coros)
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Fetch Coros → coros_data.json
        continue-on-error: true
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          COROS_REGION: eu
          # Histórico: cubre las 14 semanas del gráfico de tendencia y también
          # el gráfico de FC reposo mensual (que empieza en enero), así que se
          # pide el año entero.
          COROS_DAYS: "370"
        run: node --experimental-strip-types scripts/coros_fetch.mjs

      # --- Sueño (API OFICIAL de COROS, mcp.coros.com) ---------------------
      # Mismo mecanismo que en el correo: coros_sleep.json se superpone sobre
      # coros_data.json, así que el bloque de Hábitos, la línea semanal de
      # sueño y la tarjeta de 14 días dejan de depender de valores manuales.
      - name: Fetch sueño (COROS MCP oficial) → coros_sleep.json
        continue-on-error: true
        env:
          # Si está definido, coros_mcp.py lo usa tal cual y se salta el refresco.
          COROS_MCP_ACCESS_TOKEN: ${{ secrets.COROS_MCP_ACCESS_TOKEN }}
          COROS_MCP_CLIENT_ID: ${{ secrets.COROS_MCP_CLIENT_ID }}
          COROS_MCP_REFRESH_TOKEN: ${{ secrets.COROS_MCP_REFRESH_TOKEN }}
          # Cubre las 12 semanas del histórico + el bloque de 30 noches.
          COROS_SLEEP_DAYS: "120"
        run: python scripts/coros_mcp.py

      # ---------------------------------------------------------------------

      - name: Update dashboard from Strava + Coros
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          # Objetivo de sueño del bloque de Hábitos. Se cambia desde
          # Settings → Secrets and variables → Actions → Variables (SLEEP_TARGET_HOURS)
          # sin tocar el código. Si la variable no existe llega vacío y el
          # script cae en su valor por defecto (7.5 en scripts/dashboard_stats.py).
          SLEEP_TARGET_HOURS: ${{ vars.SLEEP_TARGET_HOURS }}
        run: python scripts/update_dashboard.py

      - name: Commit and push (always overwrite remote)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/dashboard-kthuluh.html

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática del dashboard (Strava + Coros)"

            BRANCH=$(git rev-parse --abbrev-ref HEAD)

            echo "📥 Haciendo pull con resolución automática a favor del bot..."
            git pull --rebase --strategy-option=theirs origin "$BRANCH" || true

            echo "📤 Subiendo cambios (forzando si es necesario)..."
            git push origin "$BRANCH" || git push --force-with-lease origin "$BRANCH"
          fi
