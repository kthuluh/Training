name: Daily training + diet brief

on:
  schedule:
    # 05:00 UTC = 07:00 hora de España (CEST) / 06:00 en horario de invierno (CET).
    # Ajusta la hora si quieres que llegue a otra hora local.
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions para probar

jobs:
  send-brief:
    runs-on: ubuntu-latest
    env:
      # Para que "hoy" y "ayer" signifiquen lo mismo aquí que en tu muñeca:
      # Coros agrupa por días locales y el plan también se indexa por día.
      TZ: Europe/Madrid
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # --- Coros (opcional, librería NO oficial: @pinta365/coros) ----------
      # Si no defines COROS_EMAIL / COROS_PASSWORD como secretos, este paso
      # sale sin hacer nada y el correo va solo con Strava.
      #
      # `continue-on-error: true` es a propósito: es una API privada que Coros
      # puede cambiar cuando quiera; si un día rompe, no queremos quedarnos sin
      # correo. Ver README (paso 4) para el porqué y cómo depurarlo.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de JSR (@pinta365/coros)
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No hay package-lock.json en el repo → npm install (recomendado: generar el lock y subirlo)."
            npm install --no-audit --no-fund
          fi

      - name: Fetch Coros → coros_data.json
        continue-on-error: true
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          # España = eu; en=Americas, cn=China
          COROS_REGION: eu
          # al correo solo le hace falta el día de hoy + contexto
          COROS_DAYS: "30"
        run: node --experimental-strip-types scripts/coros_fetch.mjs

      # --- Sueño (API OFICIAL de COROS, mcp.coros.com) ---------------------
      # La librería de arriba (EvoLab) no tiene horas de sueño; el MCP oficial
      # sí (`querySleepData`). Escribe coros_sleep.json, que coros_data.load()
      # superpone sobre coros_data.json.
      #
      # `continue-on-error: true`: si el token caduca o COROS cambia algo, el
      # correo sale igual (la casilla de Sueño en "—") en vez de no salir.
      - name: Fetch sueño (COROS MCP oficial) → coros_sleep.json
        continue-on-error: true
        env:
          COROS_MCP_CLIENT_ID: ${{ secrets.COROS_MCP_CLIENT_ID }}
          COROS_MCP_REFRESH_TOKEN: ${{ secrets.COROS_MCP_REFRESH_TOKEN }}
          # Al correo le bastan las 30 noches de la línea de análisis.
          COROS_SLEEP_DAYS: "30"
        run: python scripts/coros_mcp.py

      # ---------------------------------------------------------------------

      - name: Build and send daily brief
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Mismo objetivo de sueño que el dashboard (la línea del correo usa la
          # misma cuenta). Vacío si la variable no existe → valor por defecto.
          SLEEP_TARGET_HOURS: ${{ vars.SLEEP_TARGET_HOURS }}
        run: python scripts/daily_brief.py
